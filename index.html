<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Auth Demo</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    form { margin-bottom: 20px; }
    input { display: block; margin-bottom: 10px; padding: 8px; width: 300px; }
    button { padding: 8px 16px; }
    #output { margin-top: 20px; color: green; }
    #output.error { color: red; }
  </style>
</head>
<body>

  <h1>User Authentication</h1>

  <h2>Register</h2>
  <form id="registerForm">
    <input type="text" id="regUsername" placeholder="Username" required>
    <input type="email" id="regEmail" placeholder="Email" required>
    <input type="password" id="regPassword" placeholder="Password" required>
    <button type="submit">Register</button>
  </form>

  <h2>Login</h2>
  <form id="loginForm">
    <input type="email" id="loginEmail" placeholder="Email" required>
    <input type="password" id="loginPassword" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>

  <h2>Get Protected Data</h2>
  <button id="getDataBtn">Fetch Protected Info</button>

  <div id="output"></div>

  <script>
    let token = '';

    // Register user
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('http://localhost:5000/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('regUsername').value,
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPassword').value
        })
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById('output').innerText = data.message; // Success message
      } else {
        document.getElementById('output').innerText = data.error; // Error message
        document.getElementById('output').classList.add('error');
      }
    });

    // Login user
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('http://localhost:5000/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value
        })
      });
      const data = await res.json();
      if (res.ok) {
        token = data.token;  // Save token
        document.getElementById('output').innerText = data.message; // Success message
      } else {
        document.getElementById('output').innerText = data.error; // Error message
        document.getElementById('output').classList.add('error');
      }
    });

    // Fetch protected data
    document.getElementById('getDataBtn').addEventListener('click', async () => {
      const res = await fetch('http://localhost:5000/api/protected', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.status === 200) {
        const data = await res.json();
        document.getElementById('output').innerText = JSON.stringify(data, null, 2);
      } else {
        document.getElementById('output').innerText = 'Failed to fetch protected data.';
        document.getElementById('output').classList.add('error');
      }
    });
  </script>

</body>
</html>
